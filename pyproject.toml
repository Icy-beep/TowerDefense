[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concession"
version = "0.1.0"
description = "Concession — tower defense по ООП (Python + pygame)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # pygame-ce (community edition, форк оригинального pygame, тот же
    # "import pygame") — на момент написания у обычного pygame ещё нет
    # готовых wheel-колёс под Python 3.13+, только у pygame-ce.
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
